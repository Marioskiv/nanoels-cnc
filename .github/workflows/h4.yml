# Checks the H4 CNC firmware on every change: the PC tests (interpreter, motion, self-test), LinuxCNC's own
# interpreter as a second opinion, and a real Arduino build (the same ESP32 core and settings as the IDE).
# https://github.com/Marioskiv/nanoels-cnc - Copyright (c) 2026 Marioskiv - SPDX-License-Identifier: GPL-3.0-or-later
name: H4 firmware

on:
  push:
    branches: [main]
    paths: ['h4/**', '.github/workflows/h4.yml']
  pull_request:
    paths: ['h4/**', '.github/workflows/h4.yml']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PC tests (parser, motion simulation, overrides, step order, self-test), with a record of the results
        run: sh h4/test/record.sh
      - name: The whole firmware on the PC, used through its web API as the app uses it (test/h4sim, about 2 min)
        run: python3 h4/test/h4sim/scenario_test.py /tmp/h4sim 18180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-record
          path: h4/test/results/*.txt

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and its Chromium
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.63.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: The app's real page in a browser, connected to the whole firmware on the PC (test/h4sim)
        run: |
          python3 h4/test/h4sim/build.py /tmp/h4sim
          NODE_PATH=/tmp/pw/node_modules node h4/test/h4sim/app_test.js /tmp/h4sim 18380

  linuxcnc:
    runs-on: ubuntu-24.04
    container: debian:trixie   # Debian packages LinuxCNC (linuxcnc-uspace), Ubuntu does not
    steps:
      - name: Install LinuxCNC (for its rs274 interpreter) and the compilers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends linuxcnc-uspace g++ python3 ca-certificates
          command -v rs274
      - uses: actions/checkout@v4
      - name: Same positions and refused lines as LinuxCNC (1000 random programs), with a record of the results
        run: RS274="$(command -v rs274)" sh h4/test/record.sh
      - name: Same motion as LinuxCNC's own trajectory planner (lcnc_traj.py, LinuxCNC in G61, real time ~4 min)
        run: |
          apt-get install -y --no-install-recommends python3-numpy
          id lcnc || useradd -m lcnc
          # the steps before ran as root and may have left LinuxCNC's shared memory: the user lcnc could not open it
          for id in $(ipcs -m | awk '/^0x/ {print $2}'); do ipcrm -m "$id" || true; done
          # no realtime here (no hardware): the setuid rtapi_app makes its shared memory as root and gives it to the
          # user only afterwards, and in this container lcnc's halcmd got there first ("shmget: Permission denied").
          # Without the setuid bit everything runs as lcnc (POSIX non-realtime, as the local runs of lcnc_traj.py)
          chmod u-s "$(command -v rtapi_app)"
          W=/home/lcnc/w
          mkdir -p $W
          g++ -O2 -std=c++17 -o $W/cnc_sim h4/test/cnc_sim.cpp h4/cnc_core.cpp h4/cnc_gcode.cpp
          cp h4/test/g611_sample.ngc h4/test/g93_hard.ngc h4/test/modes_sample.ngc h4/test/polar_sample.ngc $W/
          chown -R lcnc $W
          python3 h4/test/lcnc_traj.py --linuxcnc installed --sim $W/cnc_sim --user lcnc --keep $W/out --mdi G61 \
            $W/g611_sample.ngc $W/g93_hard.ngc $W/modes_sample.ngc $W/polar_sample.ngc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-record-linuxcnc
          path: h4/test/results/*.txt

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        machine: [plain, my_machine]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # The ESP32 core (~1 GB of tools) kept between runs: its download often failed with "504 Gateway Timeout"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: arduino-esp32-3.3.12-tca8418-lcd-v1
      - name: ESP32 core and libraries
        run: |
          # a download that fails (server busy) is tried again, up to 3 times
          for try in 1 2 3; do
            arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json &&
            arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json &&
            arduino-cli lib install "Adafruit TCA8418" "LiquidCrystal" && break
            [ $try = 3 ] && exit 1
            echo "download failed, trying again in 30 s ($try / 3)"; sleep 30
          done
      - name: With an own my_machine.h (the example)
        if: matrix.machine == 'my_machine'
        run: cp h4/my_machine.h.example h4/my_machine.h
      - name: Build as the Arduino IDE does
        run: >
          arduino-cli compile --warnings default
          --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=enabled,PartitionScheme=app3M_fat9M_16MB --output-dir out h4
      - name: The step interrupt and everything it calls are in IRAM (it runs while the flash is busy)
        run: python3 h4/test/iram_check.py out/h4.ino.elf

  # On main: the firmware for updates over WiFi (the app offers it). Built without my_machine.h: an H4 keeps its
  # own machine values (stored in it) through the update.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, app, linuxcnc, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # The ESP32 core (~1 GB of tools) kept between runs: its download often failed with "504 Gateway Timeout"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: arduino-esp32-3.3.12-tca8418-lcd-v1
      - name: ESP32 core and libraries
        run: |
          # a download that fails (server busy) is tried again, up to 3 times
          for try in 1 2 3; do
            arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json &&
            arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json &&
            arduino-cli lib install "Adafruit TCA8418" "LiquidCrystal" && break
            [ $try = 3 ] && exit 1
            echo "download failed, trying again in 30 s ($try / 3)"; sleep 30
          done
      - name: Build
        id: fw
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=enabled,PartitionScheme=app3M_fat9M_16MB --output-dir out h4
          v=$(sed -n 's/^#define FW_VERSION "\(.*\)".*/\1/p' h4/h4.ino)
          cp out/h4.ino.bin "h4-firmware-$v.bin"
          # first installation over USB from a browser: bootloader, partition table and firmware in one file
          # (Arduino's merged image without its padding to 16 MB, so the stored G-code files are not erased)
          end=$((0x10000 + $(stat -c %s out/h4.ino.bin)))
          head -c $end out/h4.ino.merged.bin > "h4-firmware-$v-usb.img"
          cmp -n $(stat -c %s out/h4.ino.bin) -i 65536:0 out/h4.ino.merged.bin out/h4.ino.bin
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-v${{ steps.fw.outputs.version }}
          name: H4 CNC firmware ${{ steps.fw.outputs.version }}
          body: |
            Firmware of the H4 CNC fork, with the general default values (your machine's values are set on the H4's
            page, or put in my_machine.h when you build it yourself; see h4/GUIDE.md section 4).
            - **h4-firmware-${{ steps.fw.outputs.version }}.bin**: update over WiFi. The H4 CNC Android app offers it by
              itself, or the H4 page (Settings, WiFi and firmware, Update firmware) takes it. The H4 keeps its settings.
            - **h4-firmware-${{ steps.fw.outputs.version }}-usb.img**: first installation over USB, from Chrome or Edge on a
              computer, no Arduino IDE needed: https://espressif.github.io/esptool-js/ , Connect, Flash Address 0x0,
              this file, Program. It clears the H4's stored settings (not its G-code files).
            Only the newest firmware is kept here; the source is the h4 folder of this repository.
          files: |
            h4-firmware-${{ steps.fw.outputs.version }}.bin
            h4-firmware-${{ steps.fw.outputs.version }}-usb.img
          make_latest: false   # "latest" stays the app, so its fixed download link keeps working
      - name: Keep only the newest firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' |
            grep '^firmware-v' | grep -vx "firmware-v${{ steps.fw.outputs.version }}" |
            while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
