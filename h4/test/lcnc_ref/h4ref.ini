# h4ref.ini - LinuxCNC 2.9 as the reference for the H4's GCODE mode (test/lcnc_traj.py): the author's machine
# (X 1200 steps/mm 12 mm/s 100 mm/s2, Z 400 steps/mm 25 mm/s 100 mm/s2, C 91.733 steps/deg 360 deg/s 720 deg/s2,
# from his LinuxCNC .ini of 2026-10-25), trivkins XZC, no hardware: the joint commands are fed back as positions
# and sampled every servo period (1 ms) by halsampler. No display: h4ref_drive.py runs the program and ends LinuxCNC.
# Part of the NanoEls H4 CNC fork: https://github.com/Marioskiv/nanoels-cnc
# Copyright (c) 2026 Marioskiv
# SPDX-License-Identifier: GPL-3.0-or-later

[EMC]
VERSION = 1.1
MACHINE = h4ref

[DISPLAY]
DISPLAY = h4ref_drive.py

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = h4ref.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.025 G8

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = h4ref.hal

[KINS]
KINEMATICS = trivkins coordinates=XZC
JOINTS = 3

[TRAJ]
COORDINATES = XZC
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 25.0
MAX_ANGULAR_VELOCITY = 360.0
NO_FORCE_HOMING = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = h4ref.tbl

[AXIS_X]
MAX_VELOCITY = 12.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 12.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0
HOME = 0
HOME_SEQUENCE = 0

[AXIS_Z]
MAX_VELOCITY = 25.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 25.0
MAX_ACCELERATION = 100.0
MIN_LIMIT = -10000.0
MAX_LIMIT = 10000.0
HOME = 0
HOME_SEQUENCE = 0

[AXIS_C]
MAX_VELOCITY = 360.0
MAX_ACCELERATION = 720.0
MIN_LIMIT = -1e9
MAX_LIMIT = 1e9

[JOINT_2]
TYPE = ANGULAR
MAX_VELOCITY = 360.0
MAX_ACCELERATION = 720.0
MIN_LIMIT = -1e9
MAX_LIMIT = 1e9
HOME = 0
HOME_SEQUENCE = 0
